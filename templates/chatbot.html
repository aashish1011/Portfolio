<!-- Portfolio chat opens from the existing Namaste robot greeting. -->
<style>
    .portfolio-chat{position:fixed;right:24px;top:142px;z-index:80;font-family:Manrope,Arial,sans-serif;color:#101114}
    .portfolio-chat-toggle{display:none;border:1px solid #d9d8d2;background:#f4f3ef;color:#101114;border-radius:999px;padding:12px 16px;font:600 12px Manrope,Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px #10111418}
    .portfolio-chat-panel{display:none;position:fixed;top:96px;right:24px;width:min(370px,calc(100vw - 32px));height:min(450px,calc(100vh - 120px));padding:0;background:#f4f3ef;border:1px solid #d9d8d2;border-radius:14px;box-shadow:0 22px 55px #10111426;overflow:hidden;flex-direction:column}
    .portfolio-chat-panel.open{display:flex}
    .portfolio-chat-head{width:auto;max-width:none;height:auto;margin:0;padding:17px 18px;background:#ebe9e2;border-bottom:1px solid #d9d8d2;display:flex;justify-content:space-between;align-items:center}
    .portfolio-chat-head strong{font-size:15px;letter-spacing:-.03em}
    .portfolio-chat-head small{display:block;color:#686b72;font:10px 'DM Mono',monospace;letter-spacing:.04em;margin-top:5px}
    .portfolio-chat-close{width:30px;height:30px;background:transparent;border:1px solid #d1cfc7;border-radius:50%;color:#101114;font-size:19px;line-height:1;cursor:pointer}
    .portfolio-chat-messages{flex:1;min-height:0;overflow-y:auto;padding:17px;display:flex;flex-direction:column;gap:11px}
    .portfolio-chat-message{width:fit-content;max-width:88%;box-sizing:border-box;overflow-wrap:anywhere;word-break:normal;white-space:normal;line-height:1.6;font-size:13px;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid #e4e2dc;align-self:flex-start}
    .portfolio-chat-message p{margin:0 0 8px}
    .portfolio-chat-message p:last-child{margin-bottom:0}
    .portfolio-chat-message h3,.portfolio-chat-message h4{margin:8px 0 6px;line-height:1.35}
    .portfolio-chat-message h3:first-child,.portfolio-chat-message h4:first-child{margin-top:0}
    .portfolio-chat-message ul,.portfolio-chat-message ol{margin:6px 0;padding-left:20px}
    .portfolio-chat-message li{margin:3px 0}
    .portfolio-chat-message table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
    .portfolio-chat-message th,.portfolio-chat-message td{border:1px solid #d9d8d2;padding:6px 7px;text-align:left;vertical-align:top}
    .portfolio-chat-message th{background:#ebe9e2}
    .portfolio-chat-message code{background:#ebe9e2;border-radius:4px;padding:1px 4px}
    .portfolio-chat-message.user{background:#101114;color:#d7ff5f;border-color:#101114;align-self:flex-end}
    .portfolio-chat-form{display:flex;gap:8px;padding:13px;border-top:1px solid #d9d8d2;background:#f4f3ef}
    .portfolio-chat-form input{min-width:0;flex:1;background:#fff;color:#101114;border:1px solid #d9d8d2;border-radius:999px;padding:12px 14px;outline:none;font:13px Manrope,Arial,sans-serif}
    .portfolio-chat-form input:focus{border-color:#101114}
    .portfolio-chat-form button{border:0;border-radius:999px;background:#d7ff5f;color:#101114;padding:0 16px;font:700 12px Manrope,Arial,sans-serif;cursor:pointer}
    .portfolio-chat-form button:disabled{opacity:.55;cursor:wait}
    .robot-greeting{cursor:pointer!important;background:#f4f3ef!important;color:#101114!important;border:1px solid #d9d8d2!important;border-radius:10px!important;padding:9px 12px!important;font:600 11px Manrope,Arial,sans-serif!important;text-align:left;box-shadow:0 8px 20px #10111418!important}
    .robot-greeting:after{background:#f4f3ef!important;border-color:#d9d8d2!important}
    .robot-greeting small{display:block;margin-top:4px;color:#686b72;font:9px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
    .walkbot{pointer-events:auto!important;cursor:pointer}
    .walkbot:focus-visible,.robot-greeting:focus-visible,.portfolio-chat-toggle:focus-visible{outline:2px solid #101114;outline-offset:4px}
    @media(max-width:600px){.portfolio-chat{right:12px;top:138px}.portfolio-chat-panel{top:84px;right:12px;height:min(470px,calc(100dvh - 96px))}.robot-greeting{top:86px!important;right:62px!important;font-size:10px!important;padding:8px 10px!important}}
</style>
<aside class="portfolio-chat" aria-label="Ask Aashish about his work">
    <section class="portfolio-chat-panel" id="portfolio-chat-panel" aria-label="Chat with Aashish">
        <header class="portfolio-chat-head"><div><strong>Ask me about my work</strong><small>AASHISH KUMAR THAKUR · PORTFOLIO</small></div><button class="portfolio-chat-close" type="button" aria-label="Close chat">×</button></header>
        <div class="portfolio-chat-messages" aria-live="polite"><div class="portfolio-chat-message">Namaste. Ask me about my experience, skills, or projects.</div></div>
        <form class="portfolio-chat-form"><input name="question" placeholder="Write your question…" autocomplete="off" required><button type="submit">Send</button></form>
    </section>
    <button class="portfolio-chat-toggle" type="button" aria-expanded="false">Namaste · Chat with me ↗</button>
</aside>
<script>
    // Reuse the small Namaste robot as the launcher; retain a quiet fallback on pages without it.
    (()=>{
        const root=document.querySelector('.portfolio-chat');
        if(!root)return;
        const panel=root.querySelector('.portfolio-chat-panel');
        const fallback=root.querySelector('.portfolio-chat-toggle');
        const greeting=document.querySelector('.robot-greeting');
        const toggle=greeting||fallback;
        const close=root.querySelector('.portfolio-chat-close');
        const messages=root.querySelector('.portfolio-chat-messages');
        const form=root.querySelector('.portfolio-chat-form');
        const input=form.elements.question;
        const setOpen=open=>{panel.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));if(open)input.focus();};
        const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        const formatInline=value=>{
            let html=escapeHtml(value);
            html=html.replace(/`([^`]+)`/g,'<code>$1</code>');
            html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
            html=html.replace(/\*([^*]+)\*/g,'<em>$1</em>');
            return html;
        };
        const formatMarkdown=element=>{
            const lines=element.textContent.replace(/\r\n/g,'\n').split('\n');
            let html='';
            for(let i=0;i<lines.length;i++){
                const line=lines[i].trim();
                if(!line){continue;}
                const heading=line.match(/^#{1,6}\s+(.+)$/);
                if(heading){html+=`<h3>${formatInline(heading[1])}</h3>`;continue;}
                if(/^[-*_]{3,}$/.test(line)){html+='<hr>';continue;}
                if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1].trim())){
                    const split=row=>row.replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim());
                    const headers=split(line);
                    i++;
                    i++;
                    const rows=[];
                    while(i<lines.length&&lines[i].trim().includes('|')){
                        rows.push(split(lines[i].trim()));
                        i++;
                    }
                    i--;
                    html+='<table><thead><tr>'+headers.map(cell=>`<th>${formatInline(cell)}</th>`).join('')+'</tr></thead>';
                    html+='<tbody>'+rows.map(row=>'<tr>'+row.map(cell=>`<td>${formatInline(cell)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
                    continue;
                }
                if(/^[-*]\s+/.test(line)){
                    let items=[];
                    while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){
                        items.push(lines[i].trim().replace(/^[-*]\s+/,''));
                        i++;
                    }
                    i--;
                    html+='<ul>'+items.map(item=>`<li>${formatInline(item)}</li>`).join('')+'</ul>';
                    continue;
                }
                if(/^\d+[.)]\s+/.test(line)){
                    let items=[];
                    while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i].trim())){
                        items.push(lines[i].trim().replace(/^\d+[.)]\s+/,''));
                        i++;
                    }
                    i--;
                    html+='<ol>'+items.map(item=>`<li>${formatInline(item)}</li>`).join('')+'</ol>';
                    continue;
                }
                let paragraph=[line];
                while(i+1<lines.length){
                    const next=lines[i+1].trim();
                    if(!next||/^#{1,6}\s/.test(next)||/^[-*]\s+/.test(next)||/^\d+[.)]\s+/.test(next)||next.includes('|'))break;
                    paragraph.push(next);
                    i++;
                }
                html+=`<p>${formatInline(paragraph.join(' '))}</p>`;
            }
            element.innerHTML=html;
        };
        if(greeting){
            const text=greeting.textContent.trim()||'Namaste';
            greeting.textContent=text;
            const hint=document.createElement('small');hint.textContent='Chat with me ↗';greeting.appendChild(hint);
            greeting.setAttribute('role','button');greeting.setAttribute('tabindex','0');greeting.setAttribute('aria-label','Namaste. Chat with me.');
        }else{
            fallback.style.display='inline-flex';
        }
        toggle.addEventListener('click',()=>setOpen(!panel.classList.contains('open')));
        toggle.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setOpen(!panel.classList.contains('open'));}});
        close.addEventListener('click',()=>setOpen(false));
        const robot=document.querySelector('.walkbot');
        if(robot){
            robot.removeAttribute('aria-hidden');robot.setAttribute('role','button');robot.setAttribute('tabindex','0');robot.setAttribute('aria-label','Open chat with Aashish');
            robot.addEventListener('click',()=>setOpen(!panel.classList.contains('open')));
            robot.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setOpen(!panel.classList.contains('open'));}});
        }
        const addMessage=(text,kind='')=>{const item=document.createElement('div');item.className=`portfolio-chat-message ${kind}`;item.textContent=text;messages.appendChild(item);messages.scrollTop=messages.scrollHeight;return item;};
        form.addEventListener('submit',async event=>{
            event.preventDefault();
            const question=input.value.trim();
            if(!question)return;
            addMessage(question,'user');input.value='';
            const pending=addMessage('One moment…');
            const submit=form.querySelector('button');submit.disabled=true;
            try{
                const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
                if(!response.ok){
                    const result=await response.json();
                    pending.textContent=result.error||'The assistant is temporarily unavailable.';
                }else{
                    pending.textContent='';
                    const reader=response.body.getReader();
                    const decoder=new TextDecoder();
                    while(true){
                        const {value,done}=await reader.read();
                        if(done)break;
                        pending.textContent+=decoder.decode(value,{stream:true});
                        messages.scrollTop=messages.scrollHeight;
                    }
                    pending.textContent+=decoder.decode();
                    formatMarkdown(pending);
                    messages.scrollTop=messages.scrollHeight;
                }
            }catch(error){pending.textContent='I could not connect right now. Please try again shortly.';}
            finally{submit.disabled=false;messages.scrollTop=messages.scrollHeight;}
        });
    })();
</script>
