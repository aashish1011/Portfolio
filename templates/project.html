<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ project.title }} · Portfolio</title><style>:root{--ink:#101114;--paper:#f4f3ef;--lime:#d7ff5f;--muted:#686b72}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Arial,sans-serif}.wrap{width:min(900px,calc(100% - 40px));margin:auto}.top{padding:22px 0;border-bottom:1px solid #d9d8d2}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.05em;font-size:18px}.brand span{color:#686b72;font-weight:500}.back{color:var(--ink);font-size:13px}.back:hover{color:#555}main{padding:90px 0 110px}.label{font:11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}h1{font-size:clamp(48px,9vw,100px);line-height:.88;letter-spacing:-.09em;margin:0 0 30px;max-width:820px}.rule{height:1px;background:#d9d8d2;margin-bottom:36px}.description{font-size:clamp(20px,3vw,30px);line-height:1.35;letter-spacing:-.03em;max-width:760px}.project-image{width:180px;height:180px;border-radius:50%;object-fit:cover;margin:0 0 36px;border:7px solid #25282d;background:#777b80}.demo{display:inline-block;margin-top:38px;background:var(--ink);color:#fff;text-decoration:none;border-radius:999px;padding:14px 20px;font-weight:700;font-size:13px}.demo:hover{background:#303238}@media(max-width:600px){.wrap{width:calc(100% - 28px)}main{padding:55px 0 70px}.top .wrap{align-items:flex-start;gap:15px}.project-image{width:135px;height:135px}.description{font-size:21px}}</style></head><body><header class="top"><div class="wrap"><div class="brand">AKT<span> / PROJECT</span></div><a class="back" href="/#projects">← Back to projects</a></div></header><main class="wrap">{% if project.image %}<img class="project-image" src="{{ project.image }}" alt="{{ project.title }}" onerror="this.onerror=null;this.src='/static/images/ai.jpg'">{% else %}<img class="project-image" src="/static/images/ai.jpg" alt="">{% endif %}<div class="label">{{ project.label or 'Project' }}</div><h1>{{ project.title }}</h1><div class="rule"></div><div class="description">{{ project.description or 'More details coming soon.' }}</div>{% if project.link %}<a class="demo" href="{{ project.link }}" target="_blank" rel="noreferrer">View live demo ↗</a>{% endif %}</main></body></html>
